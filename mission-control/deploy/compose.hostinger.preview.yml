# Loopback-only preparation. Run from mission-control:
# docker compose -f deploy/compose.hostinger.preview.yml up --build -d
# Before public exposure, complete docs/TRINITY-RENEWAL.md release gates.
services:
  trinity-preview:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3000"
    env_file:
      - ../.env.local
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - trinity-preview-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
volumes:
  trinity-preview-data:
