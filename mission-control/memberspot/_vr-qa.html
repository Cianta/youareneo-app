<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Room QA</title><style>body{margin:0;background:#03070d}#vr-qa{position:fixed;bottom:0;left:0;z-index:999999;background:#fff;color:#111;font:11px monospace;max-width:95vw;max-height:80px;overflow:auto;padding:4px}</style><script>window.VR_IS_STANDALONE=true;window.VR_MODE=new URLSearchParams(location.search).get('pixel')==='1'?'pixel':'cinematic';var qaErrors=[];addEventListener('error',function(e){qaErrors.push(e.message)});addEventListener('unhandledrejection',function(e){qaErrors.push(String(e.reason))});setInterval(function(){var resources=performance.getEntriesByType('resource').map(function(r){return r.name});document.getElementById('vr-qa').textContent=JSON.stringify({errors:qaErrors,heavy:resources.filter(function(u){return /visual-room-assets|unsplash|cloudfront|vr-gong|vr-fire|vr-drums|vr-pyramide|vr-pagode|elfsight/.test(u)}),overflow:document.documentElement.scrollWidth>innerWidth,mode:window.VR_MODE})},1000);</script><div id="vr-mount"></div><pre id="vr-qa">Prüfung läuft</pre><script src="visual-room.bundle.js"></script></html>
