<!-- ============================================================
     VISUAL ROOM · YOU ARE NEO · Memberspot-Seite
     Gebaut aus memberspot/visual-room/*.html|js  (build.sh)
     Energie-Visualizer, 3D-Mandalas, Waldrahmen mit Zauberschlange,
     Krafttiere, Anhänger & Glockenspiel, Trommel-Uhr, Klangwelten-
     Katalog mit Konten, Meine Liste, Playlisten, Song einreichen,
     Tempel-Gong.  Anpassen: VR_CONFIG im Skript.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Orbitron:wght@500;600;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
#vr-root{--night:#03070D;--deep:#0B1A2B;--cyan:#2FD3E8;--cyan2:#7FD9E8;--orange:#F2913C;--silver:#C9D5E0;--steel:#5A7184;
  --wood:#2a1a10;--wood2:#4a2e18;--ochre:#b5542a;--gold:#e8b94a;--moss:#3f5a2c;--glass:rgba(10,18,24,.62);--line:rgba(127,217,232,.18);
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) 300px;width:100%;background:var(--night);color:var(--silver);
  font-family:Rajdhani,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;border-radius:18px;overflow:clip;isolation:isolate}
#vr-root *{box-sizing:border-box}
#vr-root:fullscreen{overflow-y:auto;overflow-x:hidden;border-radius:0}
#vr-root a{color:var(--cyan2)}
#vr-root h2,#vr-root h3,#vr-root h4{font-family:Cinzel,Georgia,serif;font-weight:400;color:#fff;margin:0}
#vr-root button{font:inherit;color:var(--silver);background:rgba(255,255,255,.04);border:1px solid rgba(127,217,232,.25);border-radius:999px;padding:7px 13px;cursor:pointer;transition:.2s}
#vr-root button:hover{border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(47,211,232,.3)}
#vr-root button.on{background:rgba(47,211,232,.18);border-color:var(--cyan);color:#fff}
#vr-root button:disabled{opacity:.5;cursor:default}
#vr-root input,#vr-root textarea,#vr-root select{font:inherit;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(127,217,232,.25);border-radius:10px;padding:9px 11px;width:100%}
#vr-root textarea{resize:vertical;min-height:70px}
#vr-root select option{background:#0b1a2b}
#vr-root label{display:block;font-size:12px;color:var(--cyan2);margin:10px 0 4px;letter-spacing:.04em}
.vr-glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 0 50px rgba(0,0,0,.35)}
.vr-muted{color:var(--steel)}
.vr-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Bühne ---------- */
#vr-main{position:relative;min-width:0}
#vr-bg{position:sticky;top:0;height:100vh;min-height:560px;margin-bottom:-100vh;pointer-events:none}
#vr-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vr-tree{position:absolute;top:0;bottom:0;width:clamp(70px,12%,150px);background-size:cover;background-repeat:no-repeat;filter:brightness(.55) saturate(.8) contrast(1.15)}
.vr-tree.l{left:0;background-image:url("https://images.unsplash.com/photo-1569402928543-87a35efc0606?w=520&h=1400&fit=crop&crop=left&q=70&fm=jpg");
  -webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
.vr-tree.r{right:0;background-image:url("https://images.unsplash.com/photo-1627940032282-30f19d72aa9f?w=520&h=1400&fit=crop&q=70&fm=jpg");background-position:50% 0;
  -webkit-mask-image:linear-gradient(to left,#000 62%,transparent);mask-image:linear-gradient(to left,#000 62%,transparent)}
#vr-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(242,145,60,.35),transparent 65%);opacity:0;transition:opacity 2.5s}
#vr-goldwash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(232,185,74,.35),rgba(232,185,74,.08) 55%,transparent 75%);opacity:0;transition:opacity 1.2s;mix-blend-mode:screen}
#vr-title{position:absolute;left:50%;top:22px;transform:translateX(-50%);text-align:center;white-space:nowrap;transition:letter-spacing .4s}
#vr-root #vr-title h2{position:relative;font-family:Orbitron,Cinzel,sans-serif;font-weight:900;font-size:clamp(28px,5.4vw,62px);letter-spacing:.18em;
  background:linear-gradient(90deg,#2FD3E8,#b86bff 35%,#ff4fa3 55%,#F2913C 80%,#e8b94a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(184,107,255,.55)) drop-shadow(0 0 30px rgba(47,211,232,.35));background-size:200% 100%;animation:vrhue 12s linear infinite}
#vr-title h2::before,#vr-title h2::after{content:attr(data-text);position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.7}
#vr-title h2::before{animation:vrglitch 5.5s steps(1) infinite;clip-path:inset(0 0 60% 0);transform:translateX(-2px)}
#vr-title h2::after{animation:vrglitch 7s steps(1) infinite reverse;clip-path:inset(55% 0 0 0);transform:translateX(2px)}
@keyframes vrhue{to{background-position:200% 0}}
@keyframes vrglitch{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(-4px,1px);opacity:.8}95%{transform:translate(3px,-1px);opacity:.6}97%{transform:translate(-2px,0);opacity:.8}}
#vr-title p{margin:8px 0 0;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.55em;text-transform:uppercase;color:var(--cyan2);text-shadow:0 0 10px rgba(47,211,232,.6)}
#vr-root #vr-avatar{position:absolute;top:14px;right:calc(clamp(70px,12%,150px) + 10px);width:40px;height:40px;padding:0;border-radius:50%;pointer-events:auto;z-index:8;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#3a2a4a,#0b0f18);border:1.5px solid #b86bff;box-shadow:0 0 14px rgba(184,107,255,.5);font-size:16px;color:#e9d7ff}
#vr-avatar img{width:100%;height:100%;object-fit:cover;display:block}
#vr-over{z-index:7;pointer-events:none}
#vr-meter{position:absolute;right:calc(clamp(70px,12%,150px) + 8px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;align-items:center;z-index:6;opacity:.85}
#vr-meter i{display:block;width:6px;height:9px;border-radius:2px;background:rgba(127,217,232,.08);transition:background .15s,box-shadow .15s}
#vr-meter i.on{background:#2FD3E8;box-shadow:0 0 6px #2FD3E8}
#vr-meter i.warm{background:#b86bff;box-shadow:0 0 6px #b86bff}
#vr-meter i.hot{background:#F2913C;box-shadow:0 0 8px #F2913C}
#vr-meter b{display:block;width:10px;height:10px;border-radius:50%;margin-top:6px;background:#e8b94a;box-shadow:0 0 10px #e8b94a}
.vr-paused{padding:30px 12px;text-align:center;color:var(--cyan2);font-size:13px;letter-spacing:.1em}
#vr-tools{position:absolute;left:clamp(80px,13%,160px);bottom:14px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;z-index:7}
#vr-root #vr-tools button{font-size:15px;width:36px;height:36px;padding:0;background:rgba(3,7,13,.65);border-color:rgba(184,107,255,.35)}
#vr-hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan2);animation:vrfloat 2.6s ease-in-out infinite}
@keyframes vrfloat{50%{transform:translate(-50%,8px);opacity:.4}}
.vr-sec{position:relative;z-index:2}

/* ---------- Player & Trommel-Uhr ---------- */
#vr-pwrap,#vr-drum{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;z-index:6;will-change:transform}
#vr-pwrap{padding:9px;border-radius:18px}
#vr-player{max-height:440px;overflow-y:auto;overflow-x:hidden;border-radius:12px;scrollbar-width:thin}
#vr-player iframe{width:100%;border:0;border-radius:12px;display:block}
#vr-now{display:flex;align-items:center;gap:8px;min-height:0;font-size:12px;padding:6px 4px 0;color:var(--cyan2)}
#vr-now:empty{display:none}
#vr-now button{padding:3px 9px;font-size:11px}
#vr-drum{width:200px;text-align:center}
#vr-drumface{position:relative;width:200px;height:200px;cursor:pointer;border-radius:50%;filter:drop-shadow(0 0 18px rgba(0,0,0,.8)) drop-shadow(0 0 10px rgba(184,107,255,.25));touch-action:none}
#vr-drumface svg{width:100%;height:100%;display:block}
#vr-drumtime{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;font-family:Orbitron,Cinzel,sans-serif;color:#d9c7ff;font-size:27px;font-weight:600;letter-spacing:.05em;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(184,107,255,.7)}
#vr-drumtime small{font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#8a7aa8;font-weight:600;margin-top:3px}
#vr-drum.shake #vr-drumface{animation:vrshake .12s linear 8}
@keyframes vrshake{25%{transform:translate(1px,-1px) rotate(.6deg)}75%{transform:translate(-1px,1px) rotate(-.6deg)}}
#vr-drumctl{margin-top:8px;transition:opacity .3s}
.vr-drumrow{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:7px}
#vr-root #vr-drumctl button{width:32px;height:32px;padding:0;background:rgba(3,7,13,.7)}

/* ---------- Mischpult ---------- */
#vr-mix{position:absolute;left:clamp(80px,13%,160px);bottom:60px;z-index:9;pointer-events:auto;display:none;gap:10px;padding:12px;border-radius:16px;
  background:rgba(8,6,14,.88);border:1px solid rgba(184,107,255,.4);box-shadow:0 0 40px rgba(184,107,255,.2)}
#vr-mix.open{display:flex}
.vr-strip{display:flex;flex-direction:column;align-items:center;gap:6px;width:58px}
.vr-strip .vr-ico{font-size:17px;height:22px}
#vr-root .vr-strip button{width:30px;height:30px;padding:0;font-size:12px;background:rgba(255,255,255,.04)}
.vr-fader{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;direction:rtl;width:22px!important;height:110px;background:transparent!important;border:0!important;padding:0!important}
.vr-fader::-webkit-slider-runnable-track{width:4px;background:linear-gradient(#b86bff,#2FD3E8);border-radius:2px}
.vr-fader::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:12px;border-radius:3px;background:#1a0f07;border:1.5px solid #F2913C;margin-left:-8px;box-shadow:0 0 6px #F2913C}
.vr-fader::-moz-range-track{width:4px;background:linear-gradient(#b86bff,#2FD3E8)}
.vr-fader::-moz-range-thumb{width:18px;height:10px;border-radius:3px;background:#1a0f07;border:1.5px solid #F2913C}
.vr-bpm{font-family:Orbitron,monospace;font-size:13px;color:#e8b94a;text-align:center;font-variant-numeric:tabular-nums}
#vr-root .vr-strip input.vr-bpmin{width:74px;padding:4px;text-align:center;font-family:Orbitron,monospace;font-size:12px;color:#e8b94a}
.vr-strip.wide{width:84px}

/* ---------- Abschnitte ---------- */
.vr-panel{margin:0 clamp(76px,13%,160px);padding:22px}
#vr-catalog{padding-bottom:40px}
#vr-catalog h3,#vr-submit h3{font-size:22px;letter-spacing:.14em;margin-bottom:4px}
.vr-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
#vr-root .vr-tabs button{border-radius:10px}
.vr-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vr-toolbar input{flex:1;min-width:160px}
.vr-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.vr-chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid rgba(232,185,74,.35);color:#e9d7a8;background:rgba(232,185,74,.07);cursor:pointer;user-select:none;white-space:nowrap}
.vr-chip.on{background:rgba(232,185,74,.25);color:#fff;border-color:var(--gold)}
.vr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.vr-card{position:relative;padding:12px;border-radius:14px;background:rgba(11,26,43,.55);border:1px solid var(--line);transition:border-color .2s,transform .2s;touch-action:pan-y}
.vr-card:hover{border-color:rgba(232,185,74,.5)}
.vr-card .vr-ph{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;display:block;background:#0b1a2b}
.vr-card .vr-ini{width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:42px;color:#fff;
  background:radial-gradient(circle at 30% 25%,rgba(242,145,60,.55),transparent 60%),radial-gradient(circle at 70% 80%,rgba(47,211,232,.45),transparent 60%),#0b1a2b}
.vr-card h4{font-family:system-ui,sans-serif!important;font-weight:600!important;font-size:15px;margin-top:9px!important}
.vr-card p{margin:4px 0 0;font-size:12.5px;color:#aab8c4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vr-meta{font-size:12px;color:var(--steel);margin-top:2px}
.vr-soc{display:flex;gap:9px;margin-top:9px;align-items:center}
.vr-soc a{color:#7d8f9c;display:inline-flex;opacity:.85}
.vr-soc a:hover{color:var(--cyan2);opacity:1}
.vr-soc svg{width:15px;height:15px;fill:currentColor}
.vr-acts{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
#vr-root .vr-acts button{padding:4px 9px;font-size:12px}
#vr-root .vr-heart.on{color:#ff6b9a;border-color:#ff6b9a}
.vr-drag{position:absolute;top:8px;right:8px;cursor:grab;color:#7d8f9c;font-size:15px;line-height:1;padding:4px;user-select:none;touch-action:none}
.vr-rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vr-row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 36px 8px 10px;border-radius:12px;background:rgba(11,26,43,.55);border:1px solid var(--line);touch-action:pan-y}
.vr-row .vr-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:#0b1a2b;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;color:#fff}
.vr-row .vr-rt{flex:1;min-width:0}
.vr-row .vr-rt b{display:block;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr-row .vr-rt span{font-size:12px;color:var(--steel)}
#vr-root .vr-row button{padding:3px 8px;font-size:12px}
.vr-empty{padding:26px;text-align:center;color:var(--steel);border:1px dashed var(--line);border-radius:14px;margin-top:10px}
.vr-pldetail{margin-top:12px;padding:14px;border-radius:14px;border:1px solid rgba(232,185,74,.35);background:rgba(20,14,6,.5)}
.vr-dropok{outline:2px dashed var(--gold)!important;outline-offset:3px;background:rgba(232,185,74,.08)!important}
.vr-ghost{position:fixed;z-index:99999;pointer-events:none;padding:7px 12px;border-radius:999px;background:rgba(232,185,74,.92);color:#1d1206;font-weight:600;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.5);transform:translate(-50%,-120%);white-space:nowrap}
.vr-insert{height:3px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px var(--gold);margin:-2px 0}

/* ---------- Meine Liste ---------- */
#vr-aside{position:sticky;top:0;height:100vh;min-height:560px;align-self:start;display:flex;flex-direction:column;z-index:8;
  background:linear-gradient(180deg,rgba(26,16,9,.96),rgba(12,9,6,.97));border-left:1px solid rgba(181,84,42,.35)}
#vr-aside::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(92deg,transparent 0 7px,rgba(120,72,36,.25) 7px 8px,transparent 8px 19px)}
.vr-ahead{position:relative;padding:16px 14px 10px;border-bottom:1px solid rgba(181,84,42,.3)}
.vr-ahead h3{font-size:18px;letter-spacing:.12em}
.vr-acct{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;flex-wrap:wrap}
#vr-root .vr-acct button{padding:4px 10px;font-size:12px}
.vr-abody{position:relative;flex:1;overflow-y:auto;padding:10px 12px 18px;overscroll-behavior:contain}
.vr-abody h4{font-size:12px!important;letter-spacing:.2em;text-transform:uppercase;color:#d9b47a!important;margin:14px 2px 6px!important}
#vr-fav{min-height:90px;border-radius:12px;padding:4px}
#vr-fav .vr-row,#vr-mypl .vr-row{background:rgba(40,24,12,.6);border-color:rgba(181,84,42,.3)}
#vr-aside-toggle{display:none}

/* ---------- Einreichen & Tempel ---------- */
#vr-submit{margin-top:40px}
.vr-form2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.vr-form2 .full{grid-column:1/-1}
.vr-progress{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.vr-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .2s}
.vr-msg{min-height:18px;font-size:12.5px;color:var(--orange);margin-top:8px}
.vr-msg.ok{color:#8fe3a6}
#vr-temple{position:relative;height:min(720px,92vh);margin-top:60px}
#vr-temple canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vr-temple .vr-tcap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#d9b47a;pointer-events:none;white-space:nowrap}
#vr-credits{position:relative;z-index:2;padding:18px clamp(76px,13%,160px) 26px;font-size:11px;color:var(--steel)}
#vr-credits a{color:var(--steel)}

/* ---------- Dialoge ---------- */
.vr-modal{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:rgba(2,5,9,.7);padding:16px}
.vr-modal.open{display:flex}
.vr-modal .vr-box{width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;border-radius:18px;background:#0a141c;border:1px solid rgba(181,84,42,.45);box-shadow:0 20px 80px rgba(0,0,0,.6);color:var(--silver);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
.vr-modal h4{font-family:Cinzel,Georgia,serif;font-size:19px;color:#fff;letter-spacing:.08em;margin:0 0 4px}
.vr-modal .vr-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.vr-modal input,.vr-modal textarea,.vr-modal select{font:inherit;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(127,217,232,.25);border-radius:10px;padding:9px 11px;width:100%;box-sizing:border-box}
.vr-modal label{display:block;font-size:12px;color:#7FD9E8;margin:10px 0 4px}
.vr-modal button{font:inherit;color:#C9D5E0;background:rgba(255,255,255,.04);border:1px solid rgba(127,217,232,.25);border-radius:999px;padding:7px 14px;cursor:pointer}
.vr-modal button.pri{background:rgba(181,84,42,.35);border-color:#b5542a;color:#fff}
.vr-modal .vr-seg{display:flex;gap:6px;margin:12px 0 4px}
.vr-modal .vr-seg button.on{background:rgba(47,211,232,.18);border-color:#2FD3E8;color:#fff}
.vr-modal .vr-msg{min-height:18px;font-size:12.5px;color:#F2913C;margin-top:8px}
.vr-modal .vr-soc-in{display:grid;grid-template-columns:22px 1fr;gap:6px 8px;align-items:center}
.vr-modal .vr-soc-in svg{width:15px;height:15px;fill:#7d8f9c}
.vr-modal select option{background:#0b1a2b}

@media (max-width:980px){
  #vr-root{grid-template-columns:minmax(0,1fr)}
  #vr-aside{position:fixed;top:0;right:0;width:min(320px,88vw);height:100%;transform:translateX(100%);transition:transform .3s;z-index:9999}
  #vr-aside.open{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
  #vr-root #vr-aside-toggle{display:block;position:sticky;bottom:14px;margin:-50px 14px 14px auto;z-index:9;background:rgba(40,24,12,.9);border-color:#b5542a;color:#fff}
}
@media (max-width:720px){
  .vr-panel{margin:0 10px;padding:16px}
  .vr-form2{grid-template-columns:1fr}
  #vr-tools{left:10px}
  #vr-title h2{letter-spacing:.2em}
  #vr-credits{padding:18px 12px}
}

/* ---------- Werkzeug-Runen am linken Stamm ---------- */
#vr-root #vr-tools{left:calc(clamp(70px,12%,150px) * .42 - 17px);top:34%;bottom:auto;flex-direction:column;gap:10px}
#vr-root #vr-tools button{width:34px;height:34px;padding:0;border-radius:50%;font-size:15px;color:#c9a6ff;opacity:.5;
  background:radial-gradient(circle at 40% 35%,#3a2616,#140b05 75%);border:1px solid rgba(90,60,30,.9);box-shadow:inset 0 2px 5px rgba(0,0,0,.8),0 0 0 rgba(184,107,255,0);text-shadow:0 0 6px #b86bff}
#vr-root #vr-tools button:hover,#vr-root #vr-tools button.on{opacity:1;box-shadow:inset 0 2px 5px rgba(0,0,0,.8),0 0 16px rgba(184,107,255,.7)}
/* ---------- Player-Steuerung ---------- */
#vr-pctl{position:absolute;top:-14px;right:10px;display:flex;gap:4px;opacity:0;transition:opacity .3s}
